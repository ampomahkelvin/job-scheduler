version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: job-scheduler-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: node dist/server.js
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - API_KEY=${API_KEY:-your-secret-api-key-here}
      - LOG_LEVEL=info
      - BULL_BOARD_PATH=/admin/queues
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  worker:
    build: .
    command: node dist/worker.js
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - API_KEY=${API_KEY:-your-secret-api-key-here}
      - BULL_BOARD_PATH=/admin/queues
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  redis-data:
    driver: local